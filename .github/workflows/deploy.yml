name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A 250 MB document is generated at deploy time (never committed) so the live demo
      # can prove HTTP Range loading on a genuinely large file.
      - run: npm run generate:docs -- --name "Claim Archive (250 MB)" --pages 600 --mb 250
      - run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # SPA fallback so deep links (e.g. /claims/c-00001) work on a static host.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
